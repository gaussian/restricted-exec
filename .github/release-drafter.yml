name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
categories:
  - title: "Breaking Changes"
    labels:
      - "breaking"
  - title: "Security"
    labels:
      - "security"
  - title: "Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "Bug Fixes"
    labels:
      - "bug"
      - "bugfix"
      - "fix"
  - title: "Documentation"
    labels:
      - "documentation"
      - "docs"
  - title: "Dependencies"
    labels:
      - "dependencies"
  - title: "Other Changes"
    labels:
      - "chore"
      - "refactor"
      - "test"
      - "ci"

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
no-changes-template: "No changes."

version-resolver:
  major:
    labels:
      - "breaking"
  minor:
    labels:
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "bug"
      - "bugfix"
      - "fix"
      - "security"
      - "documentation"
      - "dependencies"
      - "chore"
  default: patch

autolabeler:
  - label: "documentation"
    files:
      - "*.md"
      - "docs/**"
  - label: "test"
    files:
      - "tests/**"
  - label: "ci"
    files:
      - ".github/**"
  - label: "security"
    files:
      - "SECURITY.md"
    title:
      - "/security/i"
  - label: "dependencies"
    files:
      - "pyproject.toml"
      - "uv.lock"

exclude-labels:
  - "skip-changelog"

exclude-contributors:
  - "dependabot"
  - "dependabot[bot]"

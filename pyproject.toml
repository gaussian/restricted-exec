[project]
name = "restricted-exec"
version = "0.1.3"
description = "Restrictive shell/Python sanitizer + plan compiler + optional executor (no-shell)."
requires-python = ">=3.11"
dependencies = [
  "bashlex>=0.18",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["restricted_exec*"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.10"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin to the classic real-errors rule set rather than ruff 0.16+'s broad default.
select = ["E4", "E7", "E9", "F"]
ignore = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]

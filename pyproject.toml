[project]
name = "restricted-exec"
version = "0.1.0"
description = "Restrictive shell/Python sanitizer + plan compiler + optional executor (no-shell)."
requires-python = ">=3.11"
dependencies = [
  "bashlex>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
